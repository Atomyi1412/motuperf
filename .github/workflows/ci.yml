name: CI

on:
  pull_request:
  push:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore
        run: dotnet restore motuperf_cross_platform/MoTuPerf.CrossPlatform.sln --locked-mode
      - name: Test
        run: dotnet test motuperf_cross_platform/MoTuPerf.CrossPlatform.sln --configuration Release --no-restore
      - name: Build
        run: dotnet build motuperf_cross_platform/MoTuPerf.CrossPlatform.sln --configuration Release --no-restore

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest -r requirements.txt
      - name: Test Python collectors
        run: python -m pytest tests -q
